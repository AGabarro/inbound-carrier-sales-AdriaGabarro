spring:
  application:
    name: carrier-sales
  jackson:
    property-naming-strategy: SNAKE_CASE
  http:
    client:
      connect-timeout: 5s
      # Short on purpose: FmcsaClient retries once.
      read-timeout: 4s

server:
  port: ${PORT:8080}

# Non-secret values have real defaults (env var overrides them).
# Secrets have empty defaults so a missing variable fails bean validation with a clear message
# instead of an "unresolvable placeholder" stack trace. Never put a secret value in this file.
app:
  tms:
    host: ${TMS_HOST:tramway.proxy.rlwy.net}
    port: ${TMS_PORT:17159}
    token: ${TMS_TOKEN:}
  fmcsa:
    api-key: ${FMCSA_API_KEY:}
  security:
    api-key: ${API_KEY:}
  otp-sender:
    # HappyRobot "OTP Sender" workflow webhook. Empty = codes are not delivered (local runs).
    webhook-url: ${OTP_SENDER_WEBHOOK_URL:}
    api-key: ${OTP_SENDER_API_KEY:}
  carriers:
    # Contact on file per MC, for one-time codes: "133655:ops@carrier.com,650000:dispatch@other.com"
    contacts: ${CARRIER_CONTACTS:}
